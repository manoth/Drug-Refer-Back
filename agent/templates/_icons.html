{% macro icon(name, class_name='') -%}
<svg class="ui-icon {{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'database' %}
    <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
  {% elif name == 'api' %}
    <path d="M9.2 14.8 14.8 9.2"></path><path d="M7.5 17.5H6a4 4 0 0 1 0-8h3"></path><path d="M16.5 6.5H18a4 4 0 0 1 0 8h-3"></path>
  {% elif name == 'terminal' %}
    <rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="m7 9 3 3-3 3"></path><path d="M13 15h4"></path>
  {% elif name == 'logout' %}
    <path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M14 4h4a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-4"></path>
  {% elif name == 'lock' %}
    <rect x="5" y="10" width="14" height="10" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v2"></path>
  {% elif name == 'key' %}
    <circle cx="8" cy="15" r="4"></circle><path d="m11 12 8-8"></path><path d="m15 8 2 2"></path><path d="m17 6 2 2"></path>
  {% elif name == 'plug' %}
    <path d="m8 12 8-8"></path><path d="m14 4 3 3"></path><path d="m16 2 2 2"></path><path d="M7 11 4 14a4 4 0 0 0 6 6l3-3"></path><path d="m5 19-2 2"></path>
  {% elif name == 'check' %}
    <path d="m5 12 4 4L19 6"></path>
  {% elif name == 'shield' %}
    <path d="M12 3 5 6v5c0 4.8 2.8 8 7 10 4.2-2 7-5.2 7-10V6l-7-3Z"></path><path d="m9 12 2 2 4-5"></path>
  {% elif name == 'play' %}
    <path d="m8 5 11 7-11 7V5Z"></path>
  {% elif name == 'restart' %}
    <path d="M20 7v5h-5"></path><path d="M18.2 17a8 8 0 1 1 1.3-8.1L20 12"></path>
  {% elif name == 'stop' %}
    <rect x="6" y="6" width="12" height="12" rx="2"></rect>
  {% elif name == 'power' %}
    <path d="M12 3v9"></path><path d="M7.1 5.7a8 8 0 1 0 9.8 0"></path>
  {% elif name == 'activity' %}
    <path d="M3 12h4l2-6 4 12 2-6h6"></path>
  {% elif name == 'clock' %}
    <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
  {% elif name == 'send' %}
    <path d="m21 3-7 18-4-7-7-4 18-7Z"></path><path d="M10 14 21 3"></path>
  {% elif name == 'copy' %}
    <rect x="8" y="8" width="11" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"></path>
  {% elif name == 'download' %}
    <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path>
  {% elif name == 'arrow-right' %}
    <path d="M5 12h14"></path><path d="m14 7 5 5-5 5"></path>
  {% endif %}
</svg>
{%- endmacro %}
